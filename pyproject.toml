[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mergersim"
version = "0.1.0"
description = "Merger screening (shares, HHI, critical loss, diversion, UPP/GUPPI) and merger simulation with logit, nested logit and BLP demand, on the textbook datasets bundled with pyblp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xiangzhong (Shaun) Meng" }]
dependencies = [
    "numpy",
    "pandas>=2.2",
    "scipy",
    "duckdb",
    "matplotlib",
    "pyblp==1.3.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
